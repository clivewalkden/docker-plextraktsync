version: "3"
services:
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: scheduler
    depends_on:
      - plextraktsync
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.plextraktsync.schedule: "@every 6h"
      ofelia.job-run.plextraktsync.container: "plextraktsync"

  plextraktsync:
    image: ghcr.io/taxel/plextraktsync:latest
    container_name: plextraktsync
    command: sync
    # One-shot job: ofelia starts it every 6h. Any restart policy other than "no"
    # re-runs it as soon as it exits, which hammered the Plex database.
    restart: "no"
    # This plex.direct name does not resolve from any DNS server, so map it to Plex directly.
    extra_hosts:
      - "192-168-0-202.c686a8e06310464f842920ee93c81d20.plex.direct:192.168.0.202"
    volumes:
      - /home/mediaserver/.custom/plextraktsync/config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London

  plextraktwatch:
    image: ghcr.io/taxel/plextraktsync:latest
    container_name: plextraktwatch
    command: watch
    restart: on-failure:2
    volumes:
      - /home/mediaserver/.custom/plextraktwatch/config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London

